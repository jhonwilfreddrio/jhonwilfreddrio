<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color" name="theme-color" content="#262b33">
  <meta name="description" content="Save the contact details of Jhon Wilfred Drio, System and Automation Engineer / Technical Manager.">
  <title>Jhon Wilfred Drio | Digital Business Card</title>
  <link href="assets/img/site-icon-white.png" rel="icon" type="image/png">
  <script>
    (() => {
      let theme;
      try {
        const savedTheme = localStorage.getItem("nfc-theme");
        if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      } catch (_) {}
      if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root,
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #262b33;
      --text-strong: #eef2f8;
      --text-soft: #b9c2cf;
      --text-muted: #8f99a8;
      --accent: #f0a500;
      --accent-2: #d4870a;
      --shadow-dark: rgba(0, 0, 0, 0.52);
      --shadow-light: rgba(255, 255, 255, 0.055);
      --raised: 10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
      --raised-sm: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
      --inset-sm: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #e6ebf4;
      --text-strong: #2c3752;
      --text-soft: #4d5977;
      --text-muted: #596784;
      --accent: #945c00;
      --accent-2: #7f4f00;
      --shadow-dark: rgba(164, 178, 200, 0.72);
      --shadow-light: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--text-soft);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      width: min(100%, 420px);
      padding: 30px 24px 26px;
      border-radius: 26px;
      background: var(--bg);
      box-shadow: var(--raised);
      text-align: center;
    }

    .theme-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 50px;
      height: 30px;
      padding: 4px;
      border: 0;
      border-radius: 999px;
      color: var(--text-strong);
      background: var(--bg);
      box-shadow: var(--inset-sm);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle-knob {
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--text-soft);
      box-shadow: var(--raised-sm);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    html[data-theme="light"] .theme-toggle-knob {
      transform: translateX(20px);
      background: var(--accent);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .portrait-frame {
      width: 100px;
      height: 100px;
      margin: 0 auto 22px;
      padding: 7px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: var(--raised-sm);
    }

    .portrait-frame img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: clamp(1.7rem, 8vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .role {
      max-width: 340px;
      margin: 12px auto 0;
      color: var(--text-soft);
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.55;
    }

    .meta {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      margin: 24px 0;
      background: var(--shadow-dark);
      box-shadow: 0 1px 0 var(--shadow-light);
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .action {
      min-height: 48px;
      padding: 12px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: var(--text-strong);
      background: var(--bg);
      box-shadow: var(--raised-sm);
      font-size: 0.9rem;
      font-weight: 750;
      line-height: 1.2;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .action-primary {
      color: #20242b;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .action:hover {
      color: var(--accent);
    }

    .action-primary:hover {
      color: #20242b;
      filter: brightness(1.06);
    }

    .action:active {
      box-shadow: var(--inset-sm);
    }

    .action:focus-visible,
    .portfolio-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .portfolio-link {
      min-height: 44px;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      font-size: 0.85rem;
      font-weight: 700;
      text-underline-offset: 4px;
    }

    .portfolio-link:hover {
      color: var(--accent);
    }

    .privacy-note {
      margin: 18px 0 0;
      color: var(--text-muted);
      font-size: 0.72rem;
      line-height: 1.5;
    }

    html[data-theme="light"] .action-primary,
    html[data-theme="light"] .action-primary:hover {
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-toggle-knob {
        transition: none;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 18px 12px;
      }

      main {
        padding: 24px 18px 20px;
      }
    }
  </style>
</head>

<body>
  <main aria-labelledby="card-name">
    <button class="theme-toggle" type="button" aria-label="Toggle light mode" aria-pressed="false" title="Switch to light mode">
      <span class="theme-toggle-knob" aria-hidden="true"></span>
    </button>

    <div class="portrait-frame">
      <img src="assets/img/me2.jpg" alt="Portrait of Jhon Wilfred Drio" width="100" height="100" decoding="async" fetchpriority="high">
    </div>

    <p class="eyebrow">Digital business card</p>
    <h1 id="card-name">Jhon Wilfred Drio</h1>
    <p class="role">System and Automation Engineer / Technical Manager</p>
    <p class="meta">K-Pick Trading Corporation &middot; Navotas, Philippines</p>

    <div class="divider" aria-hidden="true"></div>

    <nav class="actions" aria-label="Contact actions">
      <a class="action action-primary" href="contact.vcf" type="text/vcard" download="Jhon-Wilfred-Drio.vcf" aria-label="Save Jhon Wilfred Drio to your contacts">Save Contact</a>
      <div class="secondary-actions">
        <a class="action" href="mailto:jhonwilfreddrio@gmail.com">Email</a>
        <a class="action" href="tel:+639085918691">Call</a>
      </div>
      <a class="portfolio-link" href="index.html#portfolio">View Full Portfolio</a>
    </nav>

    <p class="privacy-note">The contact file contains only the public details shown on this page.</p>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.querySelector(".theme-toggle");
      const themeColor = document.querySelector("#theme-color");
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");

      const savedTheme = () => {
        try {
          const value = localStorage.getItem("nfc-theme");
          return value === "light" || value === "dark" ? value : null;
        } catch (_) {
          return null;
        }
      };

      const applyTheme = (theme, persist) => {
        const isLight = theme === "light";
        root.dataset.theme = isLight ? "light" : "dark";
        toggle.setAttribute("aria-pressed", String(isLight));
        toggle.title = isLight ? "Switch to dark mode" : "Switch to light mode";
        themeColor.content = isLight ? "#e6ebf4" : "#262b33";
        if (persist) {
          try {
            localStorage.setItem("nfc-theme", root.dataset.theme);
          } catch (_) {}
        }
      };

      applyTheme(root.dataset.theme, false);
      toggle.addEventListener("click", () => {
        applyTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
      });

      const followSystemTheme = (event) => {
        if (!savedTheme()) applyTheme(event.matches ? "dark" : "light", false);
      };
      if (systemTheme.addEventListener) systemTheme.addEventListener("change", followSystemTheme);
    })();
  </script>
</body>

</html>
